sonar.projectKey=pierre-guillot-gh_public1
sonar.organization=pguil-github

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=public1
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Conflicting inclusion/exclusion parameters:
# src/utils/ is both explicitly included and excluded
sonar.inclusions=src/**/*.java,src/utils/**/*.java
sonar.exclusions=src/utils/**/*.java,**/test/**

# Test inclusions conflict with test exclusions above
sonar.test.inclusions=**/test/**/*.java
sonar.test.exclusions=**/test/**/*.java

# Coverage exclusions conflict with inclusions
sonar.coverage.inclusions=src/**/*.java
sonar.coverage.exclusions=src/**/*.java
